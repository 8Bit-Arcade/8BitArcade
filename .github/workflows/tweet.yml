name: Post Tweets to Discord

on:
  schedule:
    - cron: "*/10 * * * *"   # runs every 10 minutes
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch tweets and post to Discord
        env:
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1464731055247458376/W94mhWtn6yaGm7okQc2jntz4Y2G3AKJZQjhYLKrgW_9UPynf8hEk6awenBBB7cHcWteU
        run: |
          set -e

          # RSS.app feed URL
          RSS_URL="https://rss.app/feeds/MIpcEv6eV8BVwpXI.xml"
          STATE_FILE=".last_tweet"

          echo "Fetching RSS from RSS.app..."
          RSS=$(curl -fsSL "$RSS_URL" || echo "")
          if [ -z "$RSS" ]; then
            echo "⚠️ Failed to fetch RSS feed. Skipping this run."
            exit 0
          fi

          echo "Parsing tweet links..."
          # Extract links inside <item> blocks and filter only tweet URLs
          LINKS=$(echo "$RSS" \
            | grep -oP '(?<=<item>).*?(?=</item>)' \
            | grep -oP '(?<=<link>).*?(?=</link>)' \
            | grep "/status/")

          if [ -z "$LINKS" ]; then
            echo "No new tweets found in the feed."
            exit 0
          fi

          echo "Found links:"
          echo "$LINKS"

          # Load last posted tweet
          LAST_POSTED=""
          [ -f "$STATE_FILE" ] && LAST_POSTED=$(cat "$STATE_FILE")

          # Loop over links (newest first) and post to Discord
          for LINK in $LINKS; do
            if [ "$LINK" = "$LAST_POSTED" ]; then
              echo "Already posted $LINK, stopping."
              break
            fi

            echo "Posting $LINK to Discord..."
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"🐦 New post on X → $LINK\"}" \
              "$DISCORD_WEBHOOK"

            sleep 2
          done

          # Save the most recent link
          echo "$LINK" > "$STATE_FILE"

          echo "✅ Workflow completed."
