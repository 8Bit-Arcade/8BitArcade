name: Post Tweets to Discord

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Post tweets
        run: |
          curl -s https://nitter.net/8_Bit_Arcade_/rss | \
          grep "<item>" -A 20 | \
          grep "<link>" | \
          sed -e 's/<[^>]*>//g' | \
          head -n 1 | \
          xargs -I {} curl -H "Content-Type: application/json" \
          -d "{\"content\":\"🐦 New tweet → {}\"}" \
          https://discord.com/api/webhooks/1464443075827990600/C_vtfB6sFWF718HLcHo0b7MKj857VQ4mKVdWAPx9lSRhAuUZlsJ4aBT0y48QIqwGsOwX
