name: Post Tweets to Discord

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch tweets and post to Discord
        env:
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1464443075827990600/C_vtfB6sFWF718HLcHo0b7MKj857VQ4mKVdWAPx9lSRhAuUZlsJ4aBT0y48QIqwGsOwX
        run: |
          set -e

          RSS_URL="https://nitter.poast.org/8_Bit_Arcade_/rss"
          STATE_FILE=".last_tweet"

          echo "Fetching RSS from Poast Nitter..."
          RSS=$(curl -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "$RSS_URL" || echo "")
          if [ -z "$RSS" ]; then
            echo "⚠️ Failed to fetch RSS feed. Skipping this run."
            exit 0
          fi

          echo "Parsing tweet links..."
          LINKS=$(echo "$RSS" \
            | grep "<link>" \
            | sed -e 's/<[^>]*>//g' \
            | grep twitter.com \
            | sed 's|https://twitter.com|https://x.com|g')

          echo "Found links:"
          echo "$LINKS"

          LAST_POSTED=""
          [ -f "$STATE_FILE" ] && LAST_POSTED=$(cat "$STATE_FILE")

          for LINK in $LINKS; do
            if [ "$LINK" = "$LAST_POSTED" ]; then
              echo "Already posted $LINK, stopping."
              break
            fi

            echo "Posting $LINK to Discord..."
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"🐦 New post on X → $LINK\"}" \
              "$DISCORD_WEBHOOK"

            sleep 2
          done

          # Save the most recent link
          echo "$LINK" > "$STATE_FILE"

          echo "✅ Workflow completed."
