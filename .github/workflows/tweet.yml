name: Post Tweets to Discord

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch tweets and post to Discord
        env:
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1464443075827990600/C_vtfB6sFWF718HLcHo0b7MKj857VQ4mKVdWAPx9lSRhAuUZlsJ4aBT0y48QIqwGsOwX
        run: |
          set -e

          RSS_URL="https://rsshub.app/twitter/user/8_Bit_Arcade_"
          STATE_FILE=".last_tweet"

          echo "Fetching RSS..."
          RSS=$(curl -fsSL "$RSS_URL")

          echo "Parsing tweet links..."
          LINKS=$(echo "$RSS" \
            | grep "<link>" \
            | sed -e 's/<[^>]*>//g' \
            | grep twitter.com \
            | sed 's|https://twitter.com|https://x.com|g')

          LAST_POSTED=""
          [ -f "$STATE_FILE" ] && LAST_POSTED=$(cat "$STATE_FILE")

          for LINK in $LINKS; do
            if [ "$LINK" = "$LAST_POSTED" ]; then
              break
            fi

            echo "Posting $LINK"
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"🐦 New post on X → $LINK\"}" \
              "$DISCORD_WEBHOOK"

            sleep 2
          done

          echo "$LINK" > "$STATE_FILE"
